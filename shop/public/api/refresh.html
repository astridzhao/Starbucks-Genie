<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="Cache-Control" content="no-store"><title>Updating Starbucks Genie</title>
<style>body{margin:0;background:#f8faf7;color:#19392e;font:16px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}main{max-width:30rem;margin:24px;padding:32px;background:white;border:1px solid #dfe7dc;border-radius:20px}h1{font-size:1.5rem;line-height:1.3}p{color:#59705c}button,a{display:inline-block;margin:8px 8px 0 0;padding:12px 18px;border:1px solid #006241;border-radius:24px;color:white;background:#006241;font:inherit;text-decoration:none;cursor:pointer;min-height:44px}a{background:white;color:#006241}[hidden]{display:none}</style></head>
<body><main><h1 id="title">Updating your drink builder…</h1><p id="message" role="status">Your saved orders will stay on this device.</p><button id="retry" hidden>Try again</button><a id="continue" href="/customize" hidden>Open drink builder</a></main>
<script>
(async function recover(){
  try {
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(item=>new URL(item.scope).origin===location.origin).map(item=>item.unregister()));
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.filter(name=>name.startsWith('workbox-')||name==='starbucks-genie-pages-v1').map(name=>caches.delete(name)));
    }
    // Only the app shell is removed. localStorage, sessionStorage and saved
    // orders are untouched. This URL is outside legacy navigation fallbacks.
    location.replace('/customize?release=menu26-update1');
  } catch(error) {
    document.getElementById('title').textContent='The update could not finish';
    document.getElementById('message').textContent='Your saved orders are still here. Try the update again, or open the drink builder.';
    document.getElementById('retry').hidden=false;
    document.getElementById('continue').hidden=false;
    document.getElementById('retry').onclick=()=>location.reload();
  }
})();
</script></body></html>
