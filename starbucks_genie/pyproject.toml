[project]
name = "starbucks_genie"
version = "0.1.0"
description = "Starbucks-Genie using crewAI"
authors = [
    { name = "Astrid Z", email = "aastridzhao@gmail.com" },
]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.55.2,<1.0.0",
    "flask>=3.0.2",
    "flask-cors>=4.0.0",
]

[project.scripts]
starbucks_genie = "starbucks_genie.main:run"
run_crew = "starbucks_genie.main:run"
train = "starbucks_genie.main:train"
replay = "starbucks_genie.main:replay"
test = "starbucks_genie.main:test"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"
